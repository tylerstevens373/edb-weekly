<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>EDB Weekly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: press-row stat sheet. One oversized condensed week numeral up top, then a scoreboard,
   then dense, ruled stat tables. Bold lives in the masthead numeral; everything else stays quiet. */
:root {
  --bg: #eef0ec;          /* scorer's-sheet paper, slightly green-grey */
  --surface: #ffffff;
  --sunk: #e3e6e0;
  --ink: #141820;
  --muted: #5a6170;
  --line: #d3d7cf;
  --accent: #2742c4;      /* jersey royal */
  --accent-ink: #ffffff;
  --win: #1d8048;
  --loss: #c03a2c;
  --warn: #b26b00;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Public Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1016; --surface: #151922; --sunk: #1c212c; --ink: #e7e9ef; --muted: #959cab; --line: #272d39;
    --accent: #8fa3ff; --accent-ink: #0d1016; --win: #4fc283; --loss: #f0705f; --warn: #e9a63b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1016; --surface: #151922; --sunk: #1c212c; --ink: #e7e9ef; --muted: #959cab; --line: #272d39;
  --accent: #8fa3ff; --accent-ink: #0d1016; --win: #4fc283; --loss: #f0705f; --warn: #e9a63b; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num, table { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* ---------- masthead ---------- */
.mast { display: grid; grid-template-columns: auto 1fr; gap: 8px 32px; align-items: end; padding-block: 28px 20px; border-bottom: 3px solid var(--ink); }
.mast .week { font-family: var(--display); font-weight: 900; font-size: clamp(96px, 19vw, 200px); line-height: .78; letter-spacing: -.01em; }
.mast .week small { display: block; font-size: 15px; font-family: var(--mono); font-weight: 500; letter-spacing: .14em; color: var(--muted); margin-bottom: 10px; line-height: 1; }
.mast .meta { display: grid; gap: 10px; min-width: 0; padding-bottom: 6px; }
.mast .brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.mast .headline { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 4vw, 44px); line-height: 1.02; }
.mast .dek { color: var(--muted); max-width: 62ch; }
@media (max-width: 640px) { .mast { grid-template-columns: 1fr; } }

nav.sections { display: flex; flex-wrap: wrap; gap: 4px 18px; padding-block: 12px; border-bottom: 1px solid var(--line); }
nav.sections a { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); text-decoration: none; padding: 4px 0; }
nav.sections a:hover { color: var(--accent); }

.weeks { display: flex; gap: 6px; overflow-x: auto; padding-block: 14px 4px; scrollbar-width: thin; }
.weeks button { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
.weeks button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.weeks button.upcoming { border-style: dashed; }

section.block { padding-block: 40px 0; scroll-margin-top: 12px; }
.block-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; margin-bottom: 18px; }
.block-head h2 { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }
.block-head p { margin: 0; color: var(--muted); font-size: 13px; max-width: 60ch; }

/* ---------- storylines ---------- */
.stories { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.story { padding: 16px 18px 18px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.story h3 { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.05; margin-bottom: 6px; }
.story p { margin: 0; font-size: 14px; }

/* ---------- team badge ---------- */
.badge { --h: 220; display: inline-grid; place-items: center; min-width: 34px; height: 22px; padding: 0 5px; border-radius: 4px; font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
  background: color-mix(in oklab, hsl(var(--h) 62% 48%) 22%, var(--surface)); color: color-mix(in oklab, hsl(var(--h) 70% 34%) 80%, var(--ink)); border: 1px solid color-mix(in oklab, hsl(var(--h) 62% 48%) 40%, var(--surface)); text-transform: uppercase; white-space: nowrap; }
.team { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.team .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- scoreboard ---------- */
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.game .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
.game .row .score { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; min-width: 1.4ch; text-align: right; }
.game .row.lost { color: var(--muted); }
.game .row.won .nm { font-weight: 700; }
.strip { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
.strip .c { display: grid; gap: 2px; text-align: center; }
.strip .c .k { font-family: var(--mono); font-size: 9.5px; color: var(--muted); letter-spacing: .02em; }
.strip .c .led { height: 8px; border-radius: 2px; background: var(--sunk); }
.strip .c .led.a { background: var(--accent); }
.strip .c .led.h { background: var(--ink); }
.strip .c .led.t { background: repeating-linear-gradient(90deg, var(--accent) 0 4px, var(--ink) 4px 8px); opacity: .6; }
.game details summary { cursor: pointer; font-family: var(--mono); font-size: 11.5px; color: var(--muted); list-style: none; }
.game details summary::-webkit-details-marker { display: none; }
.game details summary::before { content: "+ "; }
.game details[open] summary::before { content: "− "; }
.game .note { font-size: 13.5px; border-top: 1px dashed var(--line); padding-top: 8px; }
table.box { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; margin-top: 8px; }
table.box th, table.box td { padding: 3px 4px; text-align: right; border-bottom: 1px solid var(--line); }
table.box th:first-child, table.box td:first-child { text-align: left; }
table.box td.w { color: var(--win); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 12px; align-items: center; }
.legend i { display: inline-block; width: 16px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

/* ---------- awards ---------- */
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-top: 18px; }
.award { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; display: grid; gap: 4px; align-content: start; }
.award .v { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.05; }
.award .d { font-size: 13px; color: var(--muted); }

/* ---------- tables ---------- */
.tscroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.st { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.st th { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--ink); white-space: nowrap; background: var(--surface); }
table.st td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.st th.l, table.st td.l { text-align: left; }
table.st tr:last-child td { border-bottom: 0; }
table.st tr.cut td { border-bottom: 2px dashed var(--accent); }
table.st td.rk { font-family: var(--display); font-weight: 800; font-size: 20px; width: 1%; color: var(--muted); }
.pos { color: var(--win); } .neg { color: var(--loss); }
.form { display: inline-flex; gap: 3px; }
.form i { width: 8px; height: 8px; border-radius: 50%; background: var(--sunk); display: inline-block; }
.form i.W { background: var(--win); } .form i.L { background: var(--loss); } .form i.T { background: var(--muted); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 18px; }
.two > * { min-width: 0; }
.stack { display: grid; gap: 22px; }
.tcap { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 10px; }
.tcap h3 { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; }
.move { font-family: var(--mono); font-size: 11px; }
.chip { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); margin: 1px 2px 1px 0; white-space: nowrap; }
.chip.good { border-color: color-mix(in oklab, var(--win) 50%, var(--surface)); color: var(--win); }
.chip.bad { border-color: color-mix(in oklab, var(--loss) 50%, var(--surface)); color: var(--loss); }
.bar { position: relative; height: 6px; background: var(--sunk); border-radius: 3px; width: 90px; display: inline-block; vertical-align: middle; }
.bar b { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }

/* ---------- heatmap ---------- */
.heat td.h { font-family: var(--mono); font-size: 12px; text-align: center; min-width: 46px; color: var(--ink); }
.heat th { text-align: center; }

/* ---------- players ---------- */
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; min-width: 0; }
.pcard .rank { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: .9; color: var(--accent); grid-row: span 3; }
.pcard .pn { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .pl { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pcard .ps { font-family: var(--mono); font-size: 12px; }

/* ---------- injuries / moves ---------- */
.cols { columns: 3 280px; column-gap: 24px; }
.grp { break-inside: avoid; margin-bottom: 18px; }
.grp h4 { margin: 0 0 6px; display: flex; gap: 8px; align-items: center; font-size: 14px; }
.grp ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.grp li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.grp li .sub { display: block; font-size: 12px; color: var(--muted); }
.pill { font-family: var(--mono); font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; align-self: start; white-space: nowrap; }
.pill.out { background: color-mix(in oklab, var(--loss) 16%, var(--surface)); color: var(--loss); }
.pill.gtd { background: color-mix(in oklab, var(--warn) 18%, var(--surface)); color: var(--warn); }
.pill.add { background: color-mix(in oklab, var(--win) 16%, var(--surface)); color: var(--win); }
.pill.drop { background: var(--sunk); color: var(--muted); }

.trade { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.trade .sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.trade .sides > div { min-width: 0; }
.trade ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; }
.trades { display: grid; gap: 12px; }

.champs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.champ { padding: 14px 16px; border-right: 1px solid var(--line); display: grid; gap: 2px; }
.champ .yr { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1; }
.champ .w { font-weight: 700; }

/* ---------- toolbar ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { font-family: var(--mono); font-size: 12.5px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); text-decoration: none; padding: 13px 12px 11px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.mast.compact { grid-template-columns: 1fr; padding-block: 22px 16px; }
.mast.compact .week, .mast.compact .dek { display: none; }
.mast.compact .headline { font-size: clamp(26px, 3.4vw, 36px); }

/* ---------- dynasty ---------- */
.callout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-bottom: 18px; }
.callout b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
ol.bruno { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.brow { display: grid; grid-template-columns: 54px minmax(0, 1fr) 170px 110px; gap: 8px 22px; align-items: center; padding-block: 16px; border-bottom: 1px solid var(--line); }
.brow .rk { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: .85; color: var(--muted); }
.brow.first .rk { color: var(--accent); }
.bmain { display: grid; gap: 6px; min-width: 0; }
.bteam { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-weight: 700; font-size: 16px; }
.bteam .today { font-family: var(--mono); font-size: 11.5px; font-weight: 400; }
.blurb { margin: 0; font-size: 14px; max-width: 70ch; }
.coreline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: 13px; }
.coreline .label { min-width: 0; }
.core b { font-weight: 600; }
.bwin { display: grid; gap: 2px; justify-items: start; }
.bscore { display: grid; gap: 6px; justify-items: end; }
.bscore .sn { font-family: var(--display); font-weight: 900; font-size: 38px; line-height: .9; }
.bscore .bar { width: 100%; max-width: 110px; }
.spark { display: block; max-width: 100%; height: auto; overflow: visible; }
.sk-base { stroke: var(--line); stroke-width: 1; }
.sk-mark { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; }
.sk-area { fill: color-mix(in oklab, var(--accent) 14%, transparent); stroke: none; }
.sk-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.sk-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.sk-now { fill: var(--muted); }
details.method { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 13.5px; }
details.method summary { cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
details.method ul { margin: 10px 0 0; padding-left: 18px; display: grid; gap: 6px; max-width: 78ch; }
@media (max-width: 760px) {
  .brow { grid-template-columns: 40px minmax(0, 1fr) auto; }
  .brow .rk { font-size: 34px; grid-row: span 2; align-self: start; }
  .bmain { grid-column: 2 / 4; }
  .bwin { grid-column: 2; }
  .bscore { grid-column: 3; }
}

/* ---------- draft ---------- */
.grades { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 12px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; align-content: start; }
.gcard .gl { font-family: var(--display); font-weight: 900; font-size: 56px; line-height: .8; min-width: 1.2ch; }
.gl.gA { color: var(--win); } .gl.gB { color: var(--accent); } .gl.gC { color: var(--warn); } .gl.gD { color: var(--loss); }
.gmeta { display: grid; gap: 4px; align-content: start; min-width: 0; }
.gpicks { grid-column: 1 / -1; list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.gpicks li { padding: 5px 0; border-bottom: 1px solid var(--line); }
.gnote { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--muted); }

/* ---------- trade calculator ---------- */
.tc-tools { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 10px; }
.tc-btn { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.tc-btn:hover { border-color: var(--muted); }
.tc-summary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px 14px; display: grid; gap: 10px; margin-bottom: 16px; }
.tc-verdict { font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1; text-transform: uppercase; }
.tc-verdict.fair { color: var(--win); } .tc-verdict.lean { color: var(--warn); } .tc-verdict.lop { color: var(--loss); }
.tc-bar { position: relative; height: 16px; border-radius: 999px; background: linear-gradient(90deg, color-mix(in oklab, var(--loss) 30%, var(--sunk)), var(--sunk) 35%, var(--sunk) 65%, color-mix(in oklab, var(--loss) 30%, var(--sunk))); }
.tc-fair { position: absolute; left: 45%; width: 10%; top: 0; bottom: 0; background: color-mix(in oklab, var(--win) 35%, var(--sunk)); }
.tc-mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--ink); transform: translateX(-1px); }
.tc-mark { position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--accent); transform: translate(-50%, -50%); }
@media (prefers-reduced-motion: no-preference) { .tc-mark { transition: left .25s ease; } }
.tc-ends { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); gap: 8px; }
.tc-ends span:nth-child(2) { text-align: center; }
.tc-ends span:last-child { text-align: right; }
.tc-stats { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 12.5px; color: var(--muted); }
.tc-stats b { color: var(--ink); }
.tc-sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.tc-side { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.tc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tc-team { font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); max-width: 100%; }
.tc-items ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.tc-items li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tc-name { display: grid; min-width: 0; }
.tc-name b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tc-name .muted { font-size: 12px; }
.tc-val { font-size: 13px; white-space: nowrap; }
.tc-x { border: 0; background: var(--sunk); color: var(--ink); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 16px; line-height: 1; }
.tc-x:hover { background: color-mix(in oklab, var(--loss) 25%, var(--sunk)); }
.tc-total { display: flex; justify-content: space-between; padding-top: 8px; font-size: 14px; }
.tc-empty, .tc-hint { margin: 0; font-size: 13px; color: var(--muted); }
.tc-search { position: relative; }
.tc-search input { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.tc-sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px color-mix(in oklab, var(--ink) 18%, transparent); max-height: 300px; overflow: auto; }
.tc-sugg li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.tc-sugg li[aria-selected="true"], .tc-sugg li:hover { background: var(--sunk); }
.tc-sugg li .muted { font-size: 12px; }
.tc-roster { display: grid; gap: 6px; }
.tc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tc-chip { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.tc-chip .mono { color: var(--muted); font-size: 11px; }
.tc-chip:hover:not([disabled]) { border-color: var(--accent); }
.tc-chip.on { opacity: .45; cursor: default; }
.tc-chip.add { border-color: color-mix(in oklab, var(--accent) 50%, var(--line)); }
.tc-card { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.tc-imp { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.tc-imp-h { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-weight: 600; margin-bottom: 6px; }
.tc-imp-h .mono { font-size: 12.5px; font-weight: 500; }
.tc-note { margin: 0; font-size: 12px; }

.empty { padding: 18px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); font-size: 14px; }
footer { margin-top: 56px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; }
#err { padding: 24px 0; }
@media (prefers-reduced-motion: no-preference) { .game, .pcard { transition: border-color .15s; } .game:hover, .pcard:hover { border-color: var(--muted); } }
@media (max-width: 420px) { .board { grid-template-columns: 1fr; } .block-head h2 { font-size: 28px; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="mast" id="top">
    <div class="week" id="mastWeek"><small id="mastKicker">WEEK</small><span id="mastNum">--</span></div>
    <div class="meta">
      <div class="brand" id="brand">EDB Weekly</div>
      <div class="headline" id="headline">Loading the box scores…</div>
      <div class="dek" id="dek"></div>
    </div>
  </header>
  <nav class="tabs" id="nav" aria-label="Pages"></nav>
  <div id="err" hidden></div>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<script src="model.js"></script>
<script>
(function () {
  "use strict";
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const LOW_BETTER = { TO: true };
  const PCT = { "FG%": true, "FT%": true };
  const COUNT_CATS = ["3PTM", "PTS", "REB", "AST", "ST", "BLK", "TO"];
  const CAT_LABEL = { "FG%": "FG%", "3PTM": "3PM", "FT%": "FT%", PTS: "PTS", REB: "REB", AST: "AST", ST: "STL", BLK: "BLK", TO: "TO" };
  const WEEKS_IN_SEASON = 24;

  let D, T, M; // data, teams by id, model
  let selWeek = null;

  // ---------- helpers ----------
  function hueFor(id) { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
  function shortOf(t) {
    if (!t) return "—";
    const s = (t.short || "").trim();
    if (s && s.length <= 7) return s;
    return t.name.split(/[\s:]+/).filter(Boolean).map((w) => w[0]).join("").slice(0, 4);
  }
  function badge(id) { const t = T[id]; return '<span class="badge" style="--h:' + hueFor(id) + '">' + esc(shortOf(t)) + "</span>"; }
  function teamCell(id, fallbackName) {
    const t = T[id];
    return '<span class="team">' + badge(id) + '<span class="nm">' + esc(t ? t.name : fallbackName || "—") + "</span></span>";
  }
  function fmt(c, v, perWeek) {
    if (v == null || isNaN(v)) return "–";
    if (PCT[c]) return v.toFixed(3).replace(/^0/, "");
    if (perWeek) return v >= 100 ? Math.round(v).toString() : v.toFixed(1);
    return Math.round(v).toLocaleString();
  }
  function better(c, a, b) { if (a == null || b == null || a === b) return 0; return (LOW_BETTER[c] ? a < b : a > b) ? 1 : -1; }
  function h2h(ca, cb) { let w = 0, l = 0, t = 0; for (const c of D.cats) { const r = better(c, ca[c], cb[c]); if (r > 0) w++; else if (r < 0) l++; else t++; } return { w, l, t }; }
  function realSide(s) { return s && s.id && s.id !== "-1" && T[s.id]; }
  function weekOf(n) { return D.schedule.find((s) => s.n === n); }
  function weekDates(s) { return (s && s.dates ? s.dates.replace(/[()]/g, "") : ""); }
  function ord(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

  // ---------- model ----------
  function buildModel() {
    const done = D.schedule.filter((s) => s.complete && s.matchups.some((m) => m.away.w != null));
    const ids = D.teams.map((t) => t.id);
    const allPlay = {}; const results = {}; const catSum = {}; const pctSum = {}; const weeksPlayed = {};
    ids.forEach((id) => { allPlay[id] = { w: 0, l: 0, t: 0, byWeek: {} }; results[id] = []; catSum[id] = {}; pctSum[id] = {}; weeksPlayed[id] = 0; });

    done.forEach((wk) => {
      const sides = [];
      wk.matchups.forEach((m) => {
        const a = m.away, h = m.home;
        [a, h].forEach((s) => { if (realSide(s) && s.cats && s.cats.PTS != null) sides.push(s); });
        if (realSide(a) && realSide(h) && a.w != null) {
          const ra = a.w > h.w ? "W" : a.w < h.w ? "L" : "T";
          const rh = ra === "W" ? "L" : ra === "L" ? "W" : "T";
          results[a.id].push({ n: wk.n, r: ra, opp: h.id, s: a.w + "-" + a.l + (a.t ? "-" + a.t : "") });
          results[h.id].push({ n: wk.n, r: rh, opp: a.id, s: h.w + "-" + h.l + (h.t ? "-" + h.t : "") });
        }
      });
      sides.forEach((s) => {
        let w = 0, l = 0, t = 0;
        sides.forEach((o) => { if (o === s) return; const r = h2h(s.cats, o.cats); if (r.w > r.l) w++; else if (r.w < r.l) l++; else t++; });
        allPlay[s.id].w += w; allPlay[s.id].l += l; allPlay[s.id].t += t;
        allPlay[s.id].byWeek[wk.n] = { w, l, t, of: sides.length - 1 };
        weeksPlayed[s.id]++;
        D.cats.forEach((c) => { const v = s.cats[c]; if (v == null) return; if (PCT[c]) pctSum[s.id][c] = (pctSum[s.id][c] || 0) + v; else catSum[s.id][c] = (catSum[s.id][c] || 0) + v; });
      });
    });

    // per-week season averages
    const seasonAvg = {};
    ids.forEach((id) => {
      const n = weeksPlayed[id]; if (!n) return;
      seasonAvg[id] = {}; D.cats.forEach((c) => { seasonAvg[id][c] = PCT[c] ? pctSum[id][c] / n : catSum[id][c] / n; });
    });
    // projected per-week strength
    const projWeek = {};
    ids.forEach((id) => {
      if (D.projWeekly && D.projWeekly[id]) { projWeek[id] = D.projWeekly[id]; return; }
      const p = D.proj && D.proj[id]; if (!p) return; projWeek[id] = {}; D.cats.forEach((c) => { projWeek[id][c] = PCT[c] ? p[c] : p[c] / WEEKS_IN_SEASON; });
    });
    // blended strength used for previews
    const strength = {};
    ids.forEach((id) => {
      const n = weeksPlayed[id] || 0, w = Math.min(n / 6, 1), s = seasonAvg[id], p = projWeek[id];
      strength[id] = {};
      D.cats.forEach((c) => {
        if (s && p) strength[id][c] = w * s[c] + (1 - w) * p[c];
        else strength[id][c] = s ? s[c] : p ? p[c] : null;
      });
    });

    // category ranks: season-to-date when we have 2+ weeks, else projection
    const useSeason = done.length >= 2;
    const basis = useSeason ? seasonAvg : projWeek;
    const catRank = {};
    D.cats.forEach((c) => {
      const order = ids.filter((id) => basis[id] && basis[id][c] != null).sort((a, b) => (LOW_BETTER[c] ? basis[a][c] - basis[b][c] : basis[b][c] - basis[a][c]));
      order.forEach((id, i) => { (catRank[id] = catRank[id] || {})[c] = i + 1; });
    });

    // power rankings
    function apPct(id, fromN) {
      let w = 0, g = 0; Object.entries(allPlay[id].byWeek).forEach(([n, r]) => { if (+n >= fromN) { w += r.w + r.t / 2; g += r.of; } });
      return g ? w / g : null;
    }
    function powerAt(uptoN) {
      // projected all-play when no games yet
      const score = {};
      ids.forEach((id) => {
        if (!done.length) {
          let w = 0, g = 0; ids.forEach((o) => { if (o === id || !strength[o] || !strength[id]) return; const r = h2h(strength[id], strength[o]); w += r.w > r.l ? 1 : r.w === r.l ? 0.5 : 0; g++; });
          score[id] = g ? w / g : 0;
        } else {
          let w = 0, g = 0, rw = 0, rg = 0;
          Object.entries(allPlay[id].byWeek).forEach(([n, r]) => { n = +n; if (n > uptoN) return; w += r.w + r.t / 2; g += r.of; if (n > uptoN - 3) { rw += r.w + r.t / 2; rg += r.of; } });
          score[id] = g ? 0.6 * (w / g) + 0.4 * (rg ? rw / rg : w / g) : 0;
        }
      });
      return ids.slice().sort((a, b) => score[b] - score[a]).map((id, i) => ({ id, rank: i + 1, score: score[id] }));
    }
    const lastN = done.length ? done[done.length - 1].n : 0;
    const power = powerAt(lastN);
    const prevPower = done.length > 1 ? powerAt(done[done.length - 2].n) : null;

    return { done, ids, allPlay, results, seasonAvg, projWeek, strength, catRank, useSeason, power, prevPower, lastN, weeksPlayed };
  }

  // ---------- sections ----------
  function storiesHTML() {
    const n = D.notes;
    if (!n || !n.storylines || !n.storylines.length) return "";
    return '<section class="block" id="storylines"><div class="block-head"><h2>Storylines</h2>' + (n.byline ? "<p>" + esc(n.byline) + "</p>" : "") + '</div><div class="stories">' +
      n.storylines.map((s) => '<article class="story"><h3>' + esc(s.title) + "</h3><p>" + esc(s.body) + "</p></article>").join("") + "</div></section>";
  }

  function stripHTML(a, h, values) {
    return '<div class="strip" role="img" aria-label="Category winners">' + D.cats.map((c) => {
      const r = better(c, values.a[c], values.h[c]);
      return '<div class="c"><span class="led ' + (r > 0 ? "a" : r < 0 ? "h" : "t") + '"></span><span class="k">' + CAT_LABEL[c] + "</span></div>";
    }).join("") + "</div>";
  }
  function boxTable(a, h, va, vh, perWeek) {
    return '<table class="box"><thead><tr><th></th><th>' + esc(shortOf(T[a])) + "</th><th>" + esc(shortOf(T[h])) + "</th></tr></thead><tbody>" +
      D.cats.map((c) => { const r = better(c, va[c], vh[c]); return "<tr><td>" + CAT_LABEL[c] + '</td><td class="' + (r > 0 ? "w" : "") + '">' + fmt(c, va[c], perWeek) + '</td><td class="' + (r < 0 ? "w" : "") + '">' + fmt(c, vh[c], perWeek) + "</td></tr>"; }).join("") + "</tbody></table>";
  }
  function noteFor(a, h) { const mn = D.notes && D.notes.matchups; return mn ? (mn[a + "_" + h] || mn[h + "_" + a] || "") : ""; }

  function resultsHTML(wk) {
    const games = wk.matchups.filter((m) => realSide(m.away) && realSide(m.home));
    const byes = wk.matchups.filter((m) => !(realSide(m.away) && realSide(m.home))).map((m) => realSide(m.away) ? m.away.id : realSide(m.home) ? m.home.id : null).filter(Boolean);
    const cards = games.map((m) => {
      const a = m.away, h = m.home;
      const row = (s, o) => '<div class="row ' + (s.w > o.w ? "won" : s.w < o.w ? "lost" : "") + '">' + teamCell(s.id) + '<span class="score">' + s.w + "</span></div>";
      const note = noteFor(a.id, h.id);
      return '<article class="game">' + row(a, h) + row(h, a) + stripHTML(a.id, h.id, { a: a.cats, h: h.cats }) +
        (note ? '<div class="note">' + esc(note) + "</div>" : "") +
        "<details><summary>Box score</summary>" + boxTable(a.id, h.id, a.cats, h.cats, false) + "</details></article>";
    }).join("");
    return '<div class="board">' + cards + "</div>" + legendHTML("away team won the category", "home team won it") +
      (byes.length ? '<p class="muted" style="margin:10px 0 0;font-size:13px">Bye: ' + byes.map((id) => esc(T[id].name)).join(", ") + "</p>" : "") + awardsHTML(wk, games);
  }
  function legendHTML(a, h) { return '<div class="legend"><span><i style="background:var(--accent)"></i>Top team (' + a + ')</span><span><i style="background:var(--ink)"></i>Bottom team (' + h + ")</span></div>"; }

  function awardsHTML(wk, games) {
    if (!games.length) return "";
    const ap = M.ids.filter((id) => M.allPlay[id].byWeek[wk.n]).map((id) => ({ id, ...M.allPlay[id].byWeek[wk.n] }));
    ap.sort((x, y) => (y.w + y.t / 2) - (x.w + x.t / 2));
    const best = ap[0];
    const losers = games.flatMap((m) => [m.away, m.home].filter((s) => { const o = s === m.away ? m.home : m.away; return s.w < o.w; }));
    const hardLuck = losers.map((s) => ({ id: s.id, ...(M.allPlay[s.id].byWeek[wk.n] || { w: 0 }) })).sort((x, y) => y.w - x.w)[0];
    const margins = games.map((m) => ({ m, d: Math.abs(m.away.w - m.home.w) }));
    const blow = margins.slice().sort((x, y) => y.d - x.d)[0];
    const close = margins.slice().sort((x, y) => x.d - y.d)[0];
    const winnerOf = (m) => (m.away.w >= m.home.w ? m.away : m.home), loserOf = (m) => (m.away.w >= m.home.w ? m.home : m.away);
    const kings = D.cats.map((c) => {
      const all = games.flatMap((m) => [m.away, m.home]).filter((s) => s.cats[c] != null);
      all.sort((x, y) => (LOW_BETTER[c] ? x.cats[c] - y.cats[c] : y.cats[c] - x.cats[c]));
      return all[0] ? '<span class="chip">' + CAT_LABEL[c] + " " + esc(shortOf(T[all[0].id])) + " " + fmt(c, all[0].cats[c]) + "</span>" : "";
    }).join("");
    const items = [
      ["Team of the week", T[best.id].name, "Would have beaten " + best.w + " of " + best.of + " teams this week."],
      hardLuck ? ["Hard-luck loss", T[hardLuck.id].name, "Lost, but would have beaten " + hardLuck.w + " teams."] : null,
      ["Biggest win", T[winnerOf(blow.m).id].name, winnerOf(blow.m).w + "–" + loserOf(blow.m).w + " over " + T[loserOf(blow.m).id].name + "."],
      ["Closest matchup", T[close.m.away.id].name + " vs " + T[close.m.home.id].name, close.d === 0 ? "Dead even at " + close.m.away.w + "–" + close.m.home.w + "." : "Decided " + winnerOf(close.m).w + "–" + loserOf(close.m).w + "."],
    ].filter(Boolean);
    return '<div class="awards">' + items.map((a) => '<div class="award"><span class="label">' + a[0] + '</span><span class="v">' + esc(a[1]) + '</span><span class="d">' + esc(a[2]) + "</span></div>").join("") +
      '<div class="award" style="grid-column:1/-1"><span class="label">Category leaders this week</span><div>' + kings + "</div></div></div>";
  }

  function previewHTML(wk) {
    const games = wk.matchups.filter((m) => realSide(m.away) && realSide(m.home));
    if (!games.length) return '<div class="empty">Matchups for this week are not set yet.</div>';
    const basis = M.done.length ? "blends season-to-date weekly averages with preseason projections" : "simulates a season of daily lineups from each team's 20-man roster (bench players fill in on nights starters sit), using Fantrax projections blended with last season's per-game stats";
    const cards = games.map((m) => {
      const a = m.away.id, h = m.home.id, sa = M.strength[a] || {}, sh = M.strength[h] || {};
      const r = h2h(sa, sh);
      const row = (id, sc, o) => '<div class="row ' + (sc > o ? "won" : sc < o ? "lost" : "") + '">' + teamCell(id) + '<span class="score">' + sc + "</span></div>";
      const note = noteFor(a, h);
      return '<article class="game"><span class="label">Projected</span>' + row(a, r.w, r.l) + row(h, r.l, r.w) + stripHTML(a, h, { a: sa, h: sh }) +
        (note ? '<div class="note">' + esc(note) + "</div>" : "") +
        "<details><summary>Projected weekly averages</summary>" + boxTable(a, h, sa, sh, true) + "</details></article>";
    }).join("");
    return '<div class="board">' + cards + "</div>" + legendHTML("away team projected ahead", "home team projected ahead") +
      '<p class="muted" style="font-size:12.5px;margin:8px 0 0">Projection ' + basis + ". Ties in a category show as striped.</p>";
  }

  function scoresSection() {
    const weeks = D.schedule.filter((s) => s.matchups.length);
    const upcoming = weekOf(D.currentPeriod);
    if (selWeek == null) selWeek = M.lastN || D.currentPeriod;
    const chips = weeks.filter((s) => s.complete || s.n === D.currentPeriod).map((s) =>
      '<button type="button" data-week="' + s.n + '" aria-pressed="' + (s.n === selWeek) + '" class="' + (s.complete ? "" : "upcoming") + '">' + (s.complete ? "" : "Next · ") + (s.playoff ? "Playoffs " : "Wk ") + s.n + "</button>").join("");
    const wk = weekOf(selWeek);
    const isDone = wk && wk.complete;
    const title = isDone ? (wk.playoff ? "Playoff results" : "Results") : "This week's matchups";
    const sub = (isDone ? "Week " : "Week ") + selWeek + " · " + weekDates(wk) + (isDone ? " · colored bars show who won each category" : "");
    return '<section class="block" id="scores"><div class="block-head"><h2>' + title + "</h2><p>" + esc(sub) + "</p></div>" +
      (chips ? '<div class="weeks" role="group" aria-label="Choose week">' + chips + "</div>" : "") +
      '<div style="margin-top:14px">' + (isDone ? resultsHTML(wk) : previewHTML(wk)) + "</div>" +
      (isDone && upcoming && !upcoming.complete && selWeek === M.lastN ? '<div style="margin-top:34px"><div class="tcap"><h3>Up next: week ' + upcoming.n + '</h3><span class="label">' + esc(weekDates(upcoming)) + "</span></div>" + previewHTML(upcoming) + "</div>" : "") +
      "</section>";
  }

  function divisionOf(table) {
    const counts = {}; table.rows.forEach((r) => { const d = T[r.id] && T[r.id].division; if (d) counts[d] = (counts[d] || 0) + 1; });
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).map((e) => e[0])[0] || "Division";
  }
  function formDots(id) { const r = M.results[id].slice(-5); return '<span class="form" aria-label="Last five: ' + r.map((x) => x.r).join(" ") + '">' + r.map((x) => '<i class="' + x.r + '" title="Wk ' + x.n + ": " + x.r + " " + x.s + " vs " + esc(T[x.opp] ? T[x.opp].name : "") + '"></i>').join("") + "</span>"; }

  function standingsSection() {
    if (!M.done.length) {
      const ls = D.history && D.history.lastSeason;
      if (!ls) return "";
      const rows = ls.standings.flatMap((t) => t.rows).sort((a, b) => (b.w - a.w) || (b.pf - a.pf));
      const nameToId = {}; D.teams.forEach((t) => (nameToId[t.name] = t.id));
      return '<section class="block" id="standings"><div class="block-head"><h2>' + ls.year + "–" + String(ls.year + 1).slice(2) + ' final table</h2><p>Every team starts 0–0 on Oct 20. Here is where everyone finished last season. Champion: ' + esc(ls.champion) + "; runner-up: " + esc(ls.runnerUp) + ".</p></div>" +
        '<div class="tscroll"><table class="st"><thead><tr><th class="l">#</th><th class="l">Team</th><th>W–L</th><th>Pct</th><th title="Category points for">Cat W</th><th title="Category points against">Cat L</th></tr></thead><tbody>' +
        rows.map((r, i) => '<tr><td class="rk l">' + (i + 1) + '</td><td class="l">' + teamCell(nameToId[r.name], r.name) + (r.name === ls.champion ? ' <span class="chip good">Champion</span>' : r.name === ls.runnerUp ? ' <span class="chip">Runner-up</span>' : "") + "</td><td>" + r.w + "–" + r.l + (r.t ? "–" + r.t : "") + "</td><td>" + esc(r.pct) + "</td><td>" + r.pf + "</td><td>" + r.pa + "</td></tr>").join("") +
        "</tbody></table></div></section>";
    }
    // Fantrax may not post a finished week to its table until the period formally closes (Monday evening).
    // When our results know about more regular-season games than the table does, recount from the results.
    const reg = M.done.filter((wk) => !wk.playoff);
    D.standings.forEach((t) => {
      t.rows.forEach((r) => {
        const games = M.results[r.id].filter((x) => reg.some((wk) => wk.n === x.n));
        if (games.length <= (r.w || 0) + (r.l || 0) + (r.t || 0)) return;
        let w = 0, l = 0, tt = 0, pf = 0, pa = 0;
        reg.forEach((wk) => wk.matchups.forEach((m) => [[m.away, m.home], [m.home, m.away]].forEach(([s, o]) => {
          if (s.id !== r.id || !realSide(o) || s.w == null) return;
          if (s.w > o.w) w++; else if (s.w < o.w) l++; else tt++;
          pf += s.w + (s.t || 0) / 2; pa += o.w + (o.t || 0) / 2;
        })));
        Object.assign(r, { w, l, t: tt, pf, pa, pct: ((w + tt / 2) / Math.max(1, w + l + tt)).toFixed(3).replace(/^0/, "") });
      });
      t.rows.sort((a, b) => (parseFloat(b.pct) || 0) - (parseFloat(a.pct) || 0) || b.pf - a.pf);
      const lead = t.rows[0];
      t.rows.forEach((r, i) => { r.rank = i + 1; const g = ((lead.w - r.w) + (r.l - lead.l)) / 2; r.gb = g === 0 ? "0" : String(g); });
    });
    const allRows = D.standings.flatMap((t) => t.rows);
    const overall = allRows.slice().sort((a, b) => (parseFloat(b.pct) || 0) - (parseFloat(a.pct) || 0) || b.pf - a.pf);
    const inLine = new Set(overall.slice(0, D.numPlayoffTeams || 6).map((r) => r.id));
    const tbl = (t) => {
      const head = '<thead><tr><th class="l">#</th><th class="l">Team</th><th>W–L–T</th><th>Pct</th><th>GB</th><th title="Category wins and losses">Cats</th><th title="Record if you played every team every week">All-play</th><th title="Actual wins minus all-play expected wins">Luck</th><th class="l">Last 5</th><th>Streak</th></tr></thead>';
      const body = t.rows.map((r) => {
        const ap = M.allPlay[r.id]; const g = ap.w + ap.l + ap.t;
        const exp = M.done.reduce((s, wk) => { const b = ap.byWeek[wk.n]; return s + (b ? (b.w + b.t / 2) / b.of : 0); }, 0);
        const luck = (r.w + (r.t || 0) / 2) - exp;
        return '<tr><td class="rk l">' + r.rank + '</td><td class="l">' + teamCell(r.id, r.name) + (inLine.has(r.id) ? ' <span class="chip good" title="Inside the top ' + (D.numPlayoffTeams || 6) + ' overall">IN</span>' : "") + "</td><td>" + r.w + "–" + r.l + "–" + r.t + "</td><td>" + esc(r.pct) + "</td><td>" + esc(r.gb) + "</td><td>" + r.pf + "–" + r.pa + "</td><td>" + ap.w + "–" + ap.l + (ap.t ? "–" + ap.t : "") + " <span class=\"muted\">" + (g ? ((ap.w + ap.t / 2) / g).toFixed(3).replace(/^0/, "") : "") + '</span></td><td class="' + (luck > 0.5 ? "pos" : luck < -0.5 ? "neg" : "") + '">' + (luck >= 0 ? "+" : "−") + Math.abs(luck).toFixed(1) + '</td><td class="l">' + formDots(r.id) + "</td><td>" + esc(r.streak) + "</td></tr>";
      }).join("");
      return '<div><div class="tcap"><h3>' + esc(divisionOf(t)) + '</h3></div><div class="tscroll"><table class="st">' + head + "<tbody>" + body + "</tbody></table></div></div>";
    };
    return '<section class="block" id="standings"><div class="block-head"><h2>Standings</h2><p>All-play is the record you would have if you played all 11 teams every week. Luck compares actual wins to that. “IN” marks the top ' + (D.numPlayoffTeams || 6) + " overall by win percentage; Fantrax seeding rules decide the final bracket.</p></div>" +
      '<div class="stack">' + D.standings.map(tbl).join("") + "</div></section>";
  }

  function buildChips(id) {
    const r = M.catRank[id]; if (!r) return "";
    const sorted = D.cats.slice().sort((a, b) => r[a] - r[b]);
    return sorted.slice(0, 2).map((c) => '<span class="chip good">' + CAT_LABEL[c] + " " + ord(r[c]) + "</span>").join("") + sorted.slice(-2).map((c) => '<span class="chip bad">' + CAT_LABEL[c] + " " + ord(r[c]) + "</span>").join("");
  }

  function powerSection() {
    const pre = !M.done.length;

    const rows = M.power.map((p) => {
      const mv = prev[p.id] ? prev[p.id] - p.rank : 0;
      const rec = M.results[p.id]; const w = rec.filter((x) => x.r === "W").length, l = rec.filter((x) => x.r === "L").length, t = rec.filter((x) => x.r === "T").length;
      return '<tr><td class="rk l">' + p.rank + '</td><td class="move">' + (M.prevPower ? (mv > 0 ? '<span class="pos">▲' + mv + "</span>" : mv < 0 ? '<span class="neg">▼' + (-mv) + "</span>" : '<span class="muted">–</span>') : "") + '</td><td class="l">' + teamCell(p.id) + "</td>" +

  function heatSection() {

      '<div class="tscroll"><table class="st heat"><thead><tr><th class="l">Team</th>' + D.cats.map((c) => "<th>" + CAT_LABEL[c] + "</th>").join("") + "</tr></thead><tbody>" +
      order.map((id) => '<tr><td class="l">' + teamCell(id) + "</td>" + D.cats.map((c) => cell(id, c)).join("") + "</tr>").join("") + "</tbody></table></div></section>";

        season.map((p, i) => '<tr><td class="rk l">' + (i + 1) + '</td><td class="l"><b>' + esc(p.name) + '</b> <span class="muted">' + esc(p.nba) + '</span></td><td class="l">' + (T[p.owner] ? badge(p.owner) : "—") + "</td>" + D.cats.map((c) => "<td>" + fmt(c, p.cats[c]) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div></div>" : "";

  // ---------- dynasty: Bruno Caboclo rankings ----------
  let DM = null, DG = null, PED = null, CONS = null;
  function consRank(name) {
    if (!CONS) return null;
    if (!CONS._by) { CONS._by = {}; CONS.players.forEach((p) => (CONS._by[p.name] = p)); }
    const p = CONS._by[name]; return p ? p.consensus : null;
  }
  function consCell(name) { const r = consRank(name); return r ? '<span class="mono">' + r + "</span>" : '<span class="muted">–</span>'; }
  function seasonLabel(y) { return y + "–" + String(y + 1).slice(2); }
  function spark(strength, maxS, mark) {
    const W = 156, H = 44, px = 5, py = 6, n = strength.length;
    const x = (i) => px + i * (W - 2 * px) / (n - 1), y = (v) => H - py - (Math.max(0, v) / maxS) * (H - 2 * py);
    const pts = strength.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
    const area = x(0).toFixed(1) + "," + (H - py) + " " + pts + " " + x(n - 1).toFixed(1) + "," + (H - py);
    return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Projected team strength from this season to ' + seasonLabel(DM.season + n - 1) + '">' +
      '<line class="sk-base" x1="' + px + '" x2="' + (W - px) + '" y1="' + (H - py) + '" y2="' + (H - py) + '"/>' +
      '<line class="sk-mark" x1="' + x(mark) + '" x2="' + x(mark) + '" y1="2" y2="' + (H - 2) + '"/>' +
      '<polygon class="sk-area" points="' + area + '"/><polyline class="sk-line" points="' + pts + '"/>' +
      '<circle class="sk-now" cx="' + x(0) + '" cy="' + y(strength[0]) + '" r="2.5"/><circle class="sk-dot" cx="' + x(mark) + '" cy="' + y(strength[mark]) + '" r="3.5"/></svg>';
  }
  function pickChip(k) {
    const r = ["", "1st", "2nd", "3rd"][k.round] || k.round + "th";
    return '<span class="chip' + (k.round === 1 ? " good" : "") + '" title="Projected around pick ' + k.slot + (k.orig !== k.owner && T[k.orig] ? ", from " + esc(T[k.orig].name) : "") + '">’' + String(k.year).slice(2) + " " + r + (k.orig !== k.owner && T[k.orig] ? " via " + esc(shortOf(T[k.orig])) : "") + "</span>";
  }
  function dynastySection() {
    if (!DM) return '<section class="block"><div class="empty">Dynasty projections are not available in this week\'s data.</div></section>';
    const ty = DM.titleYear, titleSeason = DM.season + ty;
    const maxTitle = Math.max.apply(null, DM.teams.map((t) => t.title)) || 1;
    const maxS = Math.max.apply(null, DM.teams.flatMap((t) => t.strength)) || 1;
    const notes = (D.notes && D.notes.bruno) || {};
    const rows = DM.teams.map((t) => {
      const mv = t.nowRank - t.rank;
      const core = t.core.map((p) => '<span class="core"><b>' + esc(p.n) + '</b> <span class="muted">' + (p.age + ty) + "</span></span>").join("");
      const blurb = notes[t.id] || ("Projected to peak in " + seasonLabel(DM.season + t.peak) + ".");
      return '<li class="brow' + (t.rank === 1 ? " first" : "") + '"><span class="rk">' + t.rank + "</span>" +
        '<div class="bmain"><div class="bteam">' + teamCell(t.id) + ' <span class="move">' + (mv > 0 ? '<span class="pos">▲' + mv + "</span>" : mv < 0 ? '<span class="neg">▼' + (-mv) + "</span>" : '<span class="muted">–</span>') + '</span><span class="muted today">#' + t.nowRank + " today</span></div>" +
        '<p class="blurb">' + esc(blurb) + "</p>" +
        '<div class="coreline"><span class="label">Core in ' + seasonLabel(titleSeason) + "</span>" + core + "</div>" +
        (t.picks.length ? '<div class="coreline"><span class="label">Picks</span>' + t.picks.map(pickChip).join("") + "</div>" : "") + "</div>" +
        '<div class="bwin">' + spark(t.strength, maxS, ty) + '<span class="label">Peak ' + seasonLabel(DM.season + t.peak) + "</span></div>" +
        '<div class="bscore"><span class="sn">' + Math.round(100 * t.title / maxTitle) + '</span><span class="bar"><b style="width:' + Math.round(100 * t.title / maxTitle) + '%"></b></span></div></li>';
    }).join("");
    const champ = DM.teams[0];
    const top = DM.players.slice().sort((a, b) => b.var[ty] - a.var[ty]).slice(0, 25);
    const maxV = top.length ? top[0].var[ty] : 1;
    const assets = '<div class="tscroll"><table class="st"><thead><tr><th class="l">#</th><th class="l">Player</th><th>Age in ' + titleSeason + '</th><th class="l">Owner</th><th title="Average of published dynasty rankings">Market rank</th><th>Value today</th><th>Value ' + seasonLabel(titleSeason) + "</th></tr></thead><tbody>" +
      top.map((p, i) => '<tr><td class="rk l">' + (i + 1) + '</td><td class="l"><b>' + esc(p.n) + '</b> <span class="muted">' + esc(p.t) + (p.ped ? " · NBA pick " + p.ped : "") + "</span></td><td>" + (p.age + ty) + '</td><td class="l">' + teamCell(p.own) + "</td><td>" + consCell(p.n) + "</td><td>" + Math.round(100 * p.var[0] / maxV) + '</td><td><span class="bar"><b style="width:' + Math.round(100 * p.var[ty] / maxV) + '%"></b></span> <b>' + Math.round(100 * p.var[ty] / maxV) + "</b></td></tr>").join("") + "</tbody></table></div>";
    const method = '<details class="method"><summary>How the projection works</summary><ul>' +
      "<li>Every rostered player starts from a blend of his Fantrax per-game projection and last season's per-game stats (up to 60% last season, less for players who missed time; rookies use the projection only), scored across all nine categories against the league's top 156 players.</li>" +
      "<li>Players age one year per season. Young players improve, most through age 25, and faster if they already produce or were high NBA draft picks. Players start declining around 29, steeply after 33, and anyone 40 or older is assumed retired.</li>" +
      "<li>Rookies' current projections mostly reflect small early roles, so for the " + (DM.season) + " class the model blends them with where the NBA drafted them.</li>" +
      "<li>Each future league pick becomes a rookie who develops the same way. Draft slot is estimated from how strong the original team is today. Fantrax only lists " + [...new Set(DM.picks.map((k) => k.year))].join(", ") + " picks, so later picks are not counted.</li>" +
      "<li>Team strength is the value of the best " + EDBModel.LINEUP + " assets above replacement level. The ranking uses the " + seasonLabel(titleSeason) + " season: two years away from being two years away. Scores are relative, with the top team at 100.</li>" +
      "<li>This is a model, not a crystal ball. Breakouts, injuries and trades will move it every week.</li>" +
      (CONS ? "<li>Market rank is the average of published dynasty rankings (" + CONS.sources.map((s) => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + "</a>").join(", ") + "), last gathered " + esc(CONS.updated) + ". Where the model and the market disagree is usually where trade opportunities are.</li>" : "") +
      "</ul></details>";
    return '<section class="block" id="bruno"><div class="block-head"><h2>Bruno Caboclo Rankings</h2><p>Two years away from being two years away: who is built to win the ' + seasonLabel(titleSeason) + " title. The line shows each roster's projected strength from this season (grey dot) to " + seasonLabel(DM.season + DM.horizon) + "; the blue dot is " + seasonLabel(titleSeason) + ".</p></div>" +
      '<div class="callout"><span class="label">Projected ' + (titleSeason + 1) + " champion</span><b>" + esc(T[champ.id].name) + "</b><span class=\"muted\">" + esc(champ.core.slice(0, 2).map((p) => p.n).join(" and ")) + " lead the way.</span></div>" +
      '<ol class="bruno">' + rows + "</ol>" +
      '<div style="margin-top:34px"><div class="tcap"><h3>Top 25 dynasty assets</h3><span class="label">Model value above replacement, top player = 100</span></div>' + assets + "</div>" + method + "</section>";
  }

  // ---------- rookie draft ----------
  function gradeClass(g) { return g ? "g" + g[0] : ""; }
  function draftSection() {
    if (!DG) return '<section class="block"><div class="empty">The most recent rookie draft is not available in this week\'s data.</div></section>';
    const notes = (D.notes && D.notes.draftGrades) || {};
    const graded = DG.grades.filter((g) => g.grade), none = DG.grades.filter((g) => !g.grade);

        else if (ev.key === "Escape") { res = []; draw(); }
      });
      ul.addEventListener("mousedown", (ev) => { const li = ev.target.closest("li"); if (!li) return; ev.preventDefault(); addItem(s, res[+li.dataset.i]); inp.value = ""; res = []; draw(); inp.focus(); });
      inp.addEventListener("blur", () => setTimeout(() => { res = []; draw(); }, 150));
    });
    paintTrade();
  }

  // ---------- render ----------
  const VIEWS = [["week", "This Week"], ["standings", "Standings"], ["trade", "Trade"], ["dynasty", "Dynasty"], ["draft", "Draft"], ["league", "League"]];
  const ALIAS = { scores: "week", storylines: "week", players: "week", power: "standings", categories: "standings", injuries: "league", moves: "league", history: "league", bruno: "dynasty" };
  let view = "week";
  function readRoute() {
    const h = (location.hash || "").slice(1);
    const m = /^week-(\d+)$/.exec(h);
    if (m && weekOf(+m[1])) { selWeek = +m[1]; return "week"; }
    if (VIEWS.some((v) => v[0] === h)) return h;
    return ALIAS[h] || "week";
  }
  function render() {
    const pre = D.phase === "preseason";
    const wk = weekOf(selWeek || M.lastN || D.currentPeriod);
    const n = D.notes || {};
    const isWeek = view === "week";
    $("#top").classList.toggle("compact", !isWeek);
    $("#mastKicker").textContent = pre ? "PRESEASON · WEEK" : (wk && wk.complete ? "RECAP · WEEK" : "PREVIEW · WEEK");
    $("#mastNum").textContent = String(pre ? 1 : (selWeek || M.lastN || D.currentPeriod)).padStart(2, "0");
    $("#brand").textContent = (D.league.name || "EDB") + " · " + (D.league.season || "");
    const titles = { trade: "Trade desk", standings: "Standings, power and categories", dynasty: "The long view", draft: "Rookie draft report card", league: "Injuries, moves and banners" };
    $("#headline").textContent = isWeek ? (n.headline || (pre ? "Season preview" : "Week " + M.lastN + " in the books")) : titles[view];
    $("#dek").textContent = isWeek ? (n.dek || "") : "";
    const parts = {
      week: [storiesHTML(), scoresSection(), playersSection()],
      standings: [powerSection(), standingsSection(), heatSection()],
      dynasty: [dynastySection()],
      draft: [draftSection()],
      trade: [tradeSection()],
      league: [injuriesSection(), movesSection(), historySection()],
    };
    $("#main").innerHTML = parts[view].join("");
    if (view === "trade") mountTrade();
    $("#nav").innerHTML = VIEWS.map(([id, l]) => '<a href="#' + id + '"' + (id === view ? ' aria-current="page"' : "") + ">" + l + "</a>").join("");
    document.title = isWeek ? "EDB Weekly" : "EDB Weekly · " + VIEWS.find((v) => v[0] === view)[1];
    const gen = new Date(D.generatedAt);
    $("#foot").innerHTML = "<span>Updated " + esc(gen.toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })) + " ET from Fantrax league data. Rebuilt automatically every Monday morning after the scoring week ends.</span>" +
      "<span>Unofficial fan page. The commissioner's recap remains the paper of record; projections are estimates, not guarantees.</span>";
    document.querySelectorAll(".weeks button").forEach((b) => b.addEventListener("click", () => {
      selWeek = +b.dataset.week;
      const y = document.getElementById("scores").getBoundingClientRect().top + window.scrollY;
      try { history.replaceState(null, "", "#week-" + selWeek); } catch (e) {}
      render(); window.scrollTo(0, y);
    }));
  }

  function init(data, pedigree) {
    D = data; T = {}; D.teams.forEach((t) => (T[t.id] = t));
    PED = pedigree || {};
    // projected weekly categories from a simulated season of daily lineups (bench players fill in on off nights)
    try { if (D.dynasty && window.EDBModel && EDBModel.simulateSeason) D.projWeekly = EDBModel.simulateSeason(D.dynasty.players, D.teams); } catch (e) { console.warn("Lineup simulation failed", e); }
    M = buildModel();
    try {
      if (D.dynasty && window.EDBModel) {
        DM = EDBModel.project(JSON.parse(JSON.stringify(D.dynasty)), D.teams, PED);
        DG = EDBModel.gradeDraft(DM, D.dynasty.draft, D.teams);
      }
    } catch (e) { DM = null; DG = null; console.warn("Dynasty model failed", e); }
    view = readRoute();
    render();
    const h = (location.hash || "").slice(1);
    if (ALIAS[h] && h !== "scores") { const el = document.getElementById(h); if (el) el.scrollIntoView(); }
    window.addEventListener("hashchange", () => {
      const prev = view; view = readRoute();
      if (/^week-\d+$/.test((location.hash || "").slice(1)) && prev === "week") return;
      render(); if (prev !== view) window.scrollTo(0, 0);
    });
  }
  window.__edbInit = init; // used by tests

  const getJson = (u) => fetch(u, { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error(u + ": HTTP " + r.status); return r.json(); });
  Promise.all([getJson("data.json"), getJson("pedigree.json").catch(() => ({})), getJson("consensus.json").catch(() => null), getJson("tradevalues.json").catch(() => null)]).then(([d, p, c, tv]) => {
    CONS = c;
    if (tv) setValues(tv.values, { live: false, snapshot: tv.snapshot, updated: tv.updated });
    init(d, p);
    loadLiveValues().then((list) => { setValues(list, { live: true }); if (view === "trade") render(); }).catch(() => {});
  }).catch((e) => {
    $("#headline").textContent = "The recap data didn't load";
    const er = $("#err"); er.hidden = false; er.textContent = "Couldn't read the league data (" + e.message + "). Refresh the page; if it keeps happening, the weekly update may have failed.";
  });
})();
</script>

</body>
</html>
